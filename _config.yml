# Site settings
title: Jin-Bin Im
email: jbim0202@hanyang.ac.kr
description: Ph.D. Candidate in Construction Management at Hanyang University
baseurl: "/jinbinim"
url: "https://jinbin-im.github.io"

# Build settings
markdown: kramdown
permalink: /:title/

# Collections
collections:
  pages:
    output: true
    permalink: /:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Navigation
navigation:
  - title: About
    url: /
  - title: Publications
    url: /publications/
  - title: Conferences
    url: /conferences/

# Author info (for highlighting in publications)
scholar:
  last_name: [Im]
  first_name: [Jin-Bin, J.-B., J. B., J.B.]

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - README.md
  - LICENSE
