# Site settings
title: Jin-Bin Im
email: your-email@hanyang.ac.kr
description: Ph.D. Candidate in Construction Management at Hanyang University
baseurl: "/jinbinim"
url: "https://jinbin-im.github.io"

# Build settings
markdown: kramdown
permalink: /:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-scholar

# Jekyll Scholar Configuration
scholar:
  style: apa
  locale: en
  source: ./_bibliography
  bibliography: publications.bib
  bibliography_template: papers
  sort_by: year
  order: descending
  
  # Author highlighting
  last_name: [Im]
  first_name: [Jin-Bin, J.-B., J. B., J.B.]
  
  # Group by year
  group_by: year
  group_order: descending

# Collections
collections:
  pages:
    output: true
    permalink: /:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Navigation
navigation:
  - title: About
    url: /
  - title: Publications
    url: /#publications
  - title: Conferences
    url: /#conferences

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - README.md
  - LICENSE
